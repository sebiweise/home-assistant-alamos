blueprint:
  name: Alamos – Automatische Rückmeldung nach Anwesenheit
  description: >-
    Meldet bei einem Alamos-Alarm automatisch zurück, abhängig davon, ob sich
    eine Person in einer Zone befindet (z. B. zu Hause oder auf der Arbeit in
    Wachennähe). Für jeden Fall kann „Zusage“, „Absage“ oder „Nichts tun“
    gewählt werden.


    Optional nur dann, wenn eine bestimmte Einheit (z. B. deine
    Favoriten-Einheit) mitalarmiert ist. Die Alamos-API selbst kennt keine
    Einheit: Eine Rückmeldung gilt immer für alle Alarme der letzten
    3 Minuten deines Profils.


    Voraussetzung: Alamos-Integration mit API-Schlüssel und Smart-Home-Abo.
  domain: automation
  author: sebiweise
  source_url: https://github.com/sebiweise/home-assistant-alamos/blob/master/blueprints/automation/alamos/presence_feedback.yaml
  homeassistant:
    min_version: "2024.11.0"
  input:
    alamos_entry:
      name: Alamos-Eintrag
      selector:
        config_entry:
          integration: alamos
    person:
      name: Person
      selector:
        entity:
          filter:
            - domain: person
    zone:
      name: Zone
      default: zone.home
      selector:
        entity:
          filter:
            - domain: zone
    mode_in_zone:
      name: Rückmeldung in der Zone
      default: accept
      selector:
        select:
          options:
            - label: Zusage
              value: accept
            - label: Absage
              value: reject
            - label: Nichts tun
              value: none
    mode_outside_zone:
      name: Rückmeldung außerhalb der Zone
      default: none
      selector:
        select:
          options:
            - label: Zusage
              value: accept
            - label: Absage
              value: reject
            - label: Nichts tun
              value: none
    delay:
      name: Verzögerung
      description: >-
        Wartezeit vor der Rückmeldung, um z. B. noch manuell in der App zu
        antworten. Muss deutlich unter 3 Minuten bleiben.
      default: 15
      selector:
        number:
          min: 0
          max: 150
          unit_of_measurement: s
    unit:
      name: Nur bei Alarm für diese Einheit
      description: >-
        Rückmeldung nur, wenn diese Einheit unter den alarmierten Einheiten ist
        (Groß-/Kleinschreibung egal), z. B. deine Favoriten-Einheit. Da
        aPager PRO je Einheit einen eigenen Webhook schickt, wartet die
        Automation bis zu 30 Sekunden nach dem Alarm auf diese Einheit.
        Leer = bei jedem Alarm.
      default: ""
      selector:
        text:
    ignore_test_alarms:
      name: Probealarme ignorieren
      default: true
      selector:
        boolean:

mode: single
max_exceeded: silent

triggers:
  - trigger: event
    event_type: alamos_alarm
    event_data:
      config_entry_id: !input alamos_entry

variables:
  alamos_entry: !input alamos_entry
  person_entity: !input person
  zone_entity: !input zone
  ignore_test: !input ignore_test_alarms
  mode_in_zone: !input mode_in_zone
  mode_outside_zone: !input mode_outside_zone
  required_unit: !input unit
  delay_seconds: !input delay
  in_zone: "{{ person_entity in (state_attr(zone_entity, 'persons') or []) }}"
  feedback_mode: "{{ mode_in_zone if in_zone else mode_outside_zone }}"

conditions:
  - condition: template
    value_template: "{{ not (ignore_test and trigger.event.data.test) }}"
  - condition: template
    value_template: "{{ feedback_mode != 'none' }}"

actions:
  - delay:
      seconds: !input delay
  - if:
      - condition: template
        value_template: "{{ required_unit | trim != '' }}"
    then:
      # Webhooks of further units arrive within 30 seconds of the first one.
      - wait_template: >-
          {% set ns = namespace(units=[]) %}
          {% for entity in integration_entities('alamos')
             if entity.startswith('binary_sensor.')
             and config_entry_id(entity) == alamos_entry %}
            {% set ns.units = state_attr(entity, 'units') or [] %}
          {% endfor %}
          {{ required_unit | trim | lower in ns.units | map('lower') | list }}
        timeout:
          seconds: "{{ [30 - (delay_seconds | int), 0] | max }}"
        continue_on_timeout: false
  - action: alamos.send_feedback
    data:
      config_entry_id: "{{ alamos_entry }}"
      mode: "{{ feedback_mode }}"
