version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Version updates wait a week: most hijacked releases are pulled within
    # days. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    # Pinned to the oldest supported Home Assistant on purpose
    # (scripts/lock_min), not to be updated.
    exclude-paths:
      - requirements_test_min.in
      - requirements_test_min.txt
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      test-dependencies:
        patterns:
          - "*"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "devcontainer"
