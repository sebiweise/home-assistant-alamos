version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    # Pinned to the oldest supported Home Assistant on purpose
    # (scripts/lock_min), not to be updated.
    exclude-paths:
      - requirements_test_min.in
      - requirements_test_min.txt
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      test-dependencies:
        patterns:
          - "*"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "devcontainer"
