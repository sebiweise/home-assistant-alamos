name: Funktionswunsch / Feature request
description: Schlage eine neue Funktion oder Verbesserung vor.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
      description: Beschreibe den Anwendungsfall, z. B. „Bei einem Alarm möchte ich …“.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Gewünschte Lösung
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Hast du bereits andere Lösungen oder Workarounds ausprobiert?
  - type: textarea
    id: docs
    attributes:
      label: Alamos-Dokumentation
      description: Links zu relevanten Seiten im Alamos-Handbuch, falls eine API- oder Webhook-Funktion betroffen ist.
